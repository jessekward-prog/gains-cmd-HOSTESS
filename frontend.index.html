<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Gains_CMD</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gains_CMD" />
  <meta property="og:description" content="AI-powered workout tracking" />
  <meta property="og:image" content="/icons/icon-512x512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    body { background: #0a0700; }
    #boot-splash { position:fixed; inset:0; z-index:9999; background:#000; transition:opacity .15s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    try {
      var deskPref = localStorage.getItem('gains-beta-desk');
      var isDesk = localStorage.getItem('gains-cmd-beta') !== 'off' && (
        deskPref === 'desk' ||
        (deskPref !== 'phone' && (window.matchMedia ? window.matchMedia('(min-width: 980px)').matches : window.innerWidth >= 980))
      );
      if (!isDesk && localStorage.getItem('gains-cmd-banner-enabled') !== 'false') {
        var splash = document.createElement('div');
        splash.id = 'boot-splash';
        splash.setAttribute('aria-hidden', 'true');
        document.body.appendChild(splash);
        var close = function () { splash.style.opacity = 0; setTimeout(function () { splash.remove(); }, 150); };
        var cap = setTimeout(close, 3800); // splash never arrived
        // Stay black until the app has something to show, so its "Loading..." never does.
        var closeWhenReady = function () {
          clearTimeout(cap);
          cap = setTimeout(close, 3000);
          poll();
        };
        var poll = function () {
          if (document.querySelector('#root > *') && !document.querySelector('[data-booting]')) close();
          else if (splash.isConnected) setTimeout(poll, 50);
        };
        // In this document, not an iframe: Chrome holds the Android app's own splash until the top page paints content.
        fetch('/boot-splash.html').then(function (r) { if (!r.ok) throw r; return r.text(); }).then(function (html) {
          clearTimeout(cap);
          var box = document.createElement('div');
          box.innerHTML = html;
          splash.attachShadow({ mode: 'open' }).appendChild(box);
          return Promise.all(box.getAnimations({ subtree: true })
            .filter(function (a) { return a.effect.getComputedTiming().endTime !== Infinity; })
            .map(function (a) { return a.finished; }));
        }).then(closeWhenReady, closeWhenReady);
      }
    } catch (e) {}
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
