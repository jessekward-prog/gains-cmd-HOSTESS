<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Gains_CMD</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    body { background: #0a0700; }
    #boot-splash { position:fixed; inset:0; z-index:9999; border:none; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    try {
      // Once per app session: the app reloads itself (theme change, appearance
      // sync after unlocking) and those reloads shouldn't replay the splash.
      if (localStorage.getItem('gains-cmd-banner-enabled') !== 'false' && !sessionStorage.getItem('gains-splash-shown')) {
        sessionStorage.setItem('gains-splash-shown', '1');
        var splash = document.createElement('iframe');
        splash.id = 'boot-splash';
        splash.title = 'Boot splash';
        splash.src = '/boot-splash.html';
        document.body.appendChild(splash);
        setTimeout(function () { splash.remove(); }, 3800);
      }
    } catch (e) {}
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
