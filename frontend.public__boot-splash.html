<style>
@keyframes crtpower {
  0%   { transform: scaleY(0.004); opacity:1; filter:brightness(1); }
  4%   { transform: scaleY(0.004); opacity:1; filter:brightness(3); }
  10%  { transform: scaleY(1); opacity:1; filter:brightness(2.2); }
  16%  { transform: scaleY(1); opacity:1; filter:brightness(1); }
  70%  { transform: scaleY(1); opacity:1; filter:brightness(1); }
  80%  { transform: scaleY(1); opacity:1; filter:brightness(2); }
  86%  { transform: scaleY(0.004); opacity:1; filter:brightness(3); }
  92%  { transform: scaleY(0.004); opacity:1; filter:brightness(1); }
  100% { transform: scaleY(0.004); opacity:0; filter:brightness(1); }
}
@keyframes textshow {
  0%,18% { opacity:0; }
  24%,78% { opacity:1; }
  84%,100% { opacity:0; }
}
body{margin:0;background:#0b0b0c;}
@keyframes basefade { 0%,92%{opacity:1;} 100%{opacity:0;} }
@keyframes grain {
  0%,100% { transform:translate(0,0); }
  10% { transform:translate(-2%,1%); }
  20% { transform:translate(1%,-2%); }
  30% { transform:translate(-1%,2%); }
  40% { transform:translate(2%,1%); }
  50% { transform:translate(-2%,-1%); }
  60% { transform:translate(1%,2%); }
  70% { transform:translate(-1%,-2%); }
  80% { transform:translate(2%,-1%); }
  90% { transform:translate(-2%,1%); }
}
@keyframes jitter {
  0%,100% { transform:translate(0,0) skewX(0); }
  20% { transform:translate(1px,0) skewX(0); }
  40% { transform:translate(-1px,1px) skewX(0); }
  60% { transform:translate(1px,-1px) skewX(0); }
  75% { transform:translate(0,0) skewX(0); }
  76% { transform:translate(-6px,2px) skewX(4deg); }
  77% { transform:translate(5px,-1px) skewX(-3deg); }
  78% { transform:translate(-4px,0) skewX(2deg); }
  79% { transform:translate(6px,1px) skewX(-4deg); }
  80% { transform:translate(-3px,-2px) skewX(3deg); }
  81% { transform:translate(4px,0) skewX(-2deg); }
  82% { transform:translate(-5px,1px) skewX(3deg); }
  83% { transform:translate(0,0) skewX(0); }
  92% { transform:translate(3px,0); }
  94% { transform:translate(-4px,0); }
  96% { transform:translate(2px,0); }
}
@keyframes flashimg1 { 0%,59.9%{opacity:0;} 60%,63.6%{opacity:1;} 63.7%,100%{opacity:0;} }
@keyframes flashimg2 { 0%,63.6%{opacity:0;} 63.7%,67.3%{opacity:1;} 67.4%,100%{opacity:0;} }
@keyframes flashimg3 { 0%,67.3%{opacity:0;} 67.4%,71%{opacity:1;} 71.1%,100%{opacity:0;} }
@keyframes flashimg4 { 0%,71%{opacity:0;} 71.1%,74.7%{opacity:1;} 74.8%,100%{opacity:0;} }
@keyframes textglitchflicker {
  0%,74% { opacity:1; }
  76% { opacity:0.2; }
  77% { opacity:1; }
  78% { opacity:0.3; }
  79% { opacity:1; }
  81% { opacity:0.15; }
  82% { opacity:1; }
  83%,100% { opacity:1; }
}
@keyframes rollbar {
  0% { transform:translateY(-120%); }
  100% { transform:translateY(120%); }
}
@keyframes tracking1 {
  0%,78% { transform:translateX(0); opacity:0; }
  79% { transform:translateX(-6px); opacity:0.8; }
  80% { transform:translateX(8px); opacity:0.8; }
  81% { transform:translateX(-3px); opacity:0.6; }
  82%,100% { transform:translateX(0); opacity:0; }
}
@keyframes tracking2 {
  0%,44% { transform:translateX(0); opacity:0; }
  45% { transform:translateX(10px); opacity:0.7; }
  46% { transform:translateX(-8px); opacity:0.7; }
  47%,100% { transform:translateX(0); opacity:0; }
}
@keyframes tracking3 {
  0%,20% { transform:translateX(0); opacity:0; }
  21% { transform:translateX(-9px); opacity:0.75; }
  22% { transform:translateX(7px); opacity:0.6; }
  23%,100% { transform:translateX(0); opacity:0; }
}
@keyframes tracking4 {
  0%,58% { transform:translateX(0); opacity:0; }
  59% { transform:translateX(11px); opacity:0.8; }
  60% { transform:translateX(-5px); opacity:0.6; }
  61%,100% { transform:translateX(0); opacity:0; }
}
@keyframes tracking5 {
  0%,90% { transform:translateX(0); opacity:0; }
  91% { transform:translateX(-7px); opacity:0.7; }
  92% { transform:translateX(9px); opacity:0.7; }
  93%,100% { transform:translateX(0); opacity:0; }
}
</style>
